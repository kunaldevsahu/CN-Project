# ---- CN Project: Edge (Mac 2, Kevish, 10.7.21.121) ----
# Location on the Mac: $(brew --prefix)/etc/nginx/servers/team1.conf
# (included automatically by Homebrew's nginx.conf via "include servers/*;")

upstream team1_backends {
    server 10.7.18.211:3001 max_fails=1 fail_timeout=10s;   # Backend A (Himanshu)
    server 10.7.16.48:3002  max_fails=1 fail_timeout=10s;   # Backend B (Kunal)
}

# Port 80: redirect everything to HTTPS
server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

# Port 443: TLS terminates here, then plain HTTP to the backends
server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/team1.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/team1.key;
    ssl_protocols       TLSv1.2 TLSv1.3;   # keep 1.2: its handshake is visible in Wireshark

    location / {
        proxy_pass http://team1_backends;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a backend is down, fail fast and retry on the other one
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
