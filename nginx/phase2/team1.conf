# ---- CN Project Phase 2: PRIMARY edge (Mac 4, Kunal, 10.7.30.71) ----
# Pranav's Mac 2 (10.7.30.229) is absent for Phase 2, so the primary edge moved to Mac 4,
# which also runs Backend B. The standby edge on Mac 3 uses nginx/phase2/team1-standby.conf
# (same upstream and settings, different X-Edge value).
# Location on Mac 4: /opt/homebrew/etc/nginx/servers/team1.conf
# Keep any old copy OUTSIDE servers/ (nginx includes every file in that folder).
#
# Changes from Phase 1 (nginx/team1.conf):
#   - shared-memory zone, so every worker sees the same up/down state      (Extension D)
#   - max_fails=2 fail_timeout=5s: quick ejection, A back within ~5 s       (Extension D)
#   - Backend B is on this same Mac, reached over loopback (127.0.0.1)
#   - evidence headers X-Edge / X-Upstream / X-Upstream-Status              (Extensions D, E)
#   - access log with upstream address + status per request                (Extensions D, F)

# One line per request: which backend(s) nginx tried and what each returned.
# A failover shows up as  upstream=10.7.3.175:3001, 127.0.0.1:3002  ustatus=502, 200
# t=$msec (epoch with ms) lets scripts/phase2/D-failover.sh line requests up with the packet capture.
log_format team1 '$time_iso8601 t=$msec client=$remote_addr "$request" status=$status '
                 'upstream=$upstream_addr ustatus=$upstream_status urt=$upstream_response_time';

upstream team1_backends {
    # Shared memory: the failure counters are shared by all worker processes.
    # 128k, not 64k: nginx needs >= 8 memory pages and Apple silicon pages are 16 KB
    # (64k fails nginx -t with: zone "team1_backends" is too small).
    zone team1_backends 128k;

    # Round robin + PASSIVE health checking (open-source nginx has no active probes):
    # 2 failed attempts (max_fails) within 5 s mark a server down for 5 s (fail_timeout);
    # after that nginx tries it again with the next real request.
    server 10.7.3.175:3001 max_fails=2 fail_timeout=5s;   # Backend A (Mac 3, Himanshu)
    server 127.0.0.1:3002  max_fails=2 fail_timeout=5s;   # Backend B (this Mac, loopback)
}

# Port 80: redirect everything to HTTPS
server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

# Port 443: TLS terminates here, then plain HTTP to the backends
server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    # Each edge has its OWN key + certificate, both signed by "Team1 Local Root CA 2026-11"
    # (certs/make-certs.sh on Mac 4; certs/make-standby-cert.sh for the Mac 3 standby).
    ssl_certificate     /opt/homebrew/etc/nginx/certs/team1.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/team1.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/team1-access.log team1;

    # Evidence headers for the demo. They reveal internal addresses, so a real
    # deployment would not send them to clients.
    add_header X-Edge            mac4-primary     always;   # which edge answered (primary or standby)
    add_header X-Upstream        $upstream_addr   always;   # backend(s) tried, in order
    add_header X-Upstream-Status $upstream_status always;   # status from each attempt

    location / {
        proxy_pass http://team1_backends;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Detect a dead backend quickly
        proxy_connect_timeout 2s;    # no SYN-ACK in 2 s (host asleep, packet dropped)
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;    # backend accepted but never answered

        # On failure, retry the SAME request once on the other backend, so the client sees 200.
        # (nginx never retries non-idempotent requests like POST unless told to.)
        proxy_next_upstream         error timeout http_502 http_503;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 6s;
    }
}
