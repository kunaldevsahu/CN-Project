# ---- CN Project Phase 2: Edge ----
# The SAME file runs on both edges:
#   Primary : Mac 2, Pranav,   10.7.30.229   (normal traffic)
#   Standby : Mac 3, Himanshu, 10.7.3.175   (Extension E, warm standby for DNS cutover)
# Location on each Mac: /opt/homebrew/etc/nginx/servers/team1.conf
# Keep the Phase 1 copy OUTSIDE servers/ (nginx includes every file in that folder).
#
# Changes from Phase 1 (nginx/team1.conf):
#   - evidence headers X-Edge / X-Upstream / X-Upstream-Status       (Extensions D, E)
#   - access log with upstream address + status per request          (Extension D, F)
#   - tighter timeouts and bounded retries for failover              (Extension D)

# One line per request: which backend(s) nginx tried and what each returned.
# A failover shows up as  upstream=10.7.3.175:3001, 10.7.30.71:3002  ustatus=502, 200
log_format team1 '$time_iso8601 client=$remote_addr "$request" status=$status '
                 'upstream=$upstream_addr ustatus=$upstream_status urt=$upstream_response_time';

upstream team1_backends {
    # Round robin + PASSIVE health checking (open-source nginx has no active probes):
    # 1 failed attempt (max_fails) marks a server down for 10 s (fail_timeout);
    # after that nginx tries it again with the next real request.
    server 10.7.3.175:3001 max_fails=1 fail_timeout=10s;   # Backend A (Mac 3, Himanshu)
    server 10.7.30.71:3002  max_fails=1 fail_timeout=10s;   # Backend B (Mac 4, Kunal)
}

# Port 80: redirect everything to HTTPS
server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

# Port 443: TLS terminates here, then plain HTTP to the backends
server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    # Each edge has its OWN key + certificate, both signed by the Team1 Local Root CA
    # (certs/make-certs.sh on Mac 2, certs/make-standby-cert.sh for Mac 3).
    ssl_certificate     /opt/homebrew/etc/nginx/certs/team1.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/team1.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /opt/homebrew/var/log/nginx/team1-access.log team1;

    # Evidence headers for the demo. They reveal internal addresses, so a real
    # deployment would not send them to clients.
    add_header X-Edge            $hostname        always;   # which edge answered (primary or standby)
    add_header X-Upstream        $upstream_addr   always;   # backend(s) tried, in order
    add_header X-Upstream-Status $upstream_status always;   # status from each attempt

    location / {
        proxy_pass http://team1_backends;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Detect a dead backend quickly
        proxy_connect_timeout 2s;    # no SYN-ACK in 2 s (host asleep, packet dropped)
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;    # backend accepted but never answered

        # On failure, retry the SAME request once on the other backend, so the client sees 200.
        # (nginx never retries non-idempotent requests like POST unless told to.)
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 6s;
    }
}
