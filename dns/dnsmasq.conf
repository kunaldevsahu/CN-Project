# ---- CN Project: Team DNS (Mac 1, Vaibhav, 10.7.16.0) ----
# Location on the Mac: $(brew --prefix)/etc/dnsmasq.conf  (/opt/homebrew/etc/dnsmasq.conf)

# Don't read /etc/resolv.conf; use these upstream servers for everything else
no-resolv
server=8.8.8.8
server=1.1.1.1

# Our zone: answer it ourselves, never forward it upstream
local=/team1.test/

# A records -> both names point to the edge (Kevish, Mac 2)
host-record=app.team1.test,10.7.21.121
host-record=api.team1.test,10.7.21.121

# TTL for our records (seconds)
local-ttl=60

# Log every query (useful for evidence and debugging)
log-queries
