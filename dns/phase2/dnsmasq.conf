# ---- CN Project Phase 2: Team DNS ----
# The SAME file runs on both DNS servers:
#   Primary : Mac 1, Vaibhav,  10.7.17.233
#   Backup  : Mac 3, Himanshu, 10.7.3.175   (Extension A)
# Location on each Mac: /opt/homebrew/etc/dnsmasq.conf
#
# Changes from Phase 1 (dns/dnsmasq.conf):
#   - records moved from host-record= lines into a hosts file (team1.hosts),
#     so a record change is a file edit + SIGHUP, no restart (Extensions B, E)
#   - TTL lowered from 60 s to 30 s (Extension B)
#   - query log written to a file so `tail -f` works during demos

# Don't read /etc/resolv.conf; use these upstream servers for everything else
no-resolv
server=8.8.8.8
server=1.1.1.1

# Our zone: answer it ourselves, never forward it upstream.
# A name under team1.test that is not in team1.hosts gets NXDOMAIN.
local=/team1.test/

# Ignore the Mac's own /etc/hosts; serve ONLY our project records
no-hosts
addn-hosts=/opt/homebrew/etc/team1.hosts

# TTL (seconds) on answers from team1.hosts. Short so the TTL demo is quick.
local-ttl=30

# Log every query, to a file (tail -f /opt/homebrew/var/log/dnsmasq.log)
log-queries
log-facility=/opt/homebrew/var/log/dnsmasq.log
